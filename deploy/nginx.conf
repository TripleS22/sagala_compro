server {
    listen 80;
    server_name sagalatech.id www.sagalatech.id;   # ganti dengan domain Anda
    client_max_body_size 6m;                        # upload gambar maks 5MB

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Aktifkan HTTPS: sudo certbot --nginx -d sagalatech.id -d www.sagalatech.id
